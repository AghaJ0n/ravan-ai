<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RAVAN AI — روان</title>
<meta name="description" content="میزکار هوشمند فارسی برای ساخت پرامپت و فرایندهای کاری بر اساس نقش، نوع کار و ابزار هوش مصنوعی.">
<script>window.__RAVAN_BOOT_STARTED_AT=performance.now();</script>
<style>
html,body{height:100%;margin:0;font-family:Tahoma,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}
#boot{position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle at 50% 38%,rgba(98,70,234,.13),transparent 31%),radial-gradient(circle at 18% 82%,rgba(47,128,237,.06),transparent 28%),linear-gradient(180deg,#fbfcff 0%,#f3f6fc 100%);opacity:1;visibility:visible;transition:opacity 220ms ease,visibility 220ms ease}
#boot.boot-ready{opacity:0;visibility:hidden;pointer-events:none}
.boot-shell{width:min(92vw,520px);box-sizing:border-box;display:grid;justify-items:center;gap:14px;padding:32px 30px 28px;text-align:center;direction:rtl;border:1px solid rgba(98,70,234,.12);border-radius:28px;background:rgba(255,255,255,.72);box-shadow:0 24px 70px rgba(43,54,91,.09);backdrop-filter:blur(16px)}
.boot-mark{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,#765bf5,#5939df);box-shadow:0 16px 38px rgba(98,70,234,.27);animation:ravanBootFloat 2.1s ease-in-out infinite}
.boot-mark svg{width:34px;height:34px;display:block}
.boot-brand{font-size:24px;font-weight:850;letter-spacing:.3px;color:#172033;margin-top:2px}
.boot-sub{font-size:13px;color:#667085;line-height:1.9;max-width:390px}
.boot-status{min-height:22px;font-size:12px;font-weight:700;color:#6246ea;transition:opacity 160ms ease}
.boot-steps{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:5px}
.boot-step{min-width:0;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px;padding:11px 10px;border:1px solid #e8eaf2;border-radius:14px;background:rgba(255,255,255,.8);color:#8a93a5;text-align:right;transition:border-color 180ms ease,background 180ms ease,color 180ms ease,transform 180ms ease}
.boot-step-dot{width:25px;height:25px;border-radius:999px;display:grid;place-items:center;background:#f0edff;color:#765bf5;font-size:11px;font-weight:800;transition:all 180ms ease}
.boot-step b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.boot-step small{display:block;font-size:9px;font-weight:400;margin-top:2px;color:#98a2b3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.boot-step.active{border-color:rgba(98,70,234,.34);background:#f6f3ff;color:#413070;transform:translateY(-1px)}
.boot-step.active .boot-step-dot{background:#6246ea;color:#fff;box-shadow:0 5px 15px rgba(98,70,234,.2)}
.boot-step.done{border-color:rgba(22,163,106,.2);background:#f3fbf7;color:#227551}
.boot-step.done .boot-step-dot{background:#16a36a;color:#fff}
.boot-progress{width:100%;height:5px;border-radius:999px;background:#eceef5;overflow:hidden;margin-top:3px;direction:rtl}
.boot-progress-bar{width:14%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#8b6cff,#6246ea);transition:width 420ms cubic-bezier(.2,.75,.3,1)}
.boot-caption{font-size:10px;color:#9aa3b4;line-height:1.7}
@keyframes ravanBootFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media(max-width:560px){#boot{padding:16px}.boot-shell{padding:26px 18px 22px;border-radius:23px}.boot-steps{grid-template-columns:1fr}.boot-step{padding:9px 11px}.boot-mark{width:58px;height:58px}.boot-brand{font-size:22px}}
@media (prefers-color-scheme:dark){html,body{background:#101526;color:#eef1ff}#boot{background:radial-gradient(circle at 50% 38%,rgba(139,112,255,.2),transparent 33%),linear-gradient(180deg,#12182a 0%,#0f1423 100%)}.boot-shell{background:rgba(19,26,45,.78);border-color:rgba(139,112,255,.17);box-shadow:0 24px 70px rgba(0,0,0,.24)}.boot-brand{color:#f3f5ff}.boot-sub,.boot-caption{color:#9ca7be}.boot-step{background:rgba(26,34,57,.78);border-color:#2a3551;color:#9ca7be}.boot-step small{color:#74809a}.boot-step.active{background:rgba(98,70,234,.16);color:#ddd6ff}.boot-step.done{background:rgba(22,163,106,.12);color:#a8e5ca}.boot-progress{background:#28334e}}
@media (prefers-reduced-motion:reduce){#boot{transition:none}.boot-mark{animation:none}.boot-step,.boot-step-dot,.boot-progress-bar{transition:none}}
</style>
</head>
<body>
<div id="boot" role="status" aria-live="polite" aria-label="در حال آماده‌سازی RAVAN AI">
  <div class="boot-shell">
    <div class="boot-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="5" y="5" width="8" height="8" rx="2.4" fill="white"/>
        <rect x="19" y="5" width="8" height="8" rx="2.4" fill="white" fill-opacity=".72"/>
        <rect x="5" y="19" width="8" height="8" rx="2.4" fill="white" fill-opacity=".72"/>
        <path d="M20 18.5h6.5v6.5H20z" fill="white"/>
        <path d="M23.25 15v13M16.75 21.5h13" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity=".72"/>
      </svg>
    </div>
    <div class="boot-brand">RAVAN AI</div>
    <div class="boot-sub">در حال آماده‌سازی فضای کاری هوشمند شما</div>
    <div class="boot-status" id="bootStatus">بارگذاری پروفایل و تنظیمات</div>
    <div class="boot-steps" aria-hidden="true">
      <div class="boot-step active" data-boot-step="0"><span class="boot-step-dot">۱</span><span><b>پروفایل</b><small>شناخت نقش و ترجیحات</small></span></div>
      <div class="boot-step" data-boot-step="1"><span class="boot-step-dot">۲</span><span><b>ابزارها</b><small>آماده‌سازی فرم و مسیر کار</small></span></div>
      <div class="boot-step" data-boot-step="2"><span class="boot-step-dot">۳</span><span><b>فضای کاری</b><small>آماده برای شروع</small></span></div>
    </div>
    <div class="boot-progress" aria-hidden="true"><div class="boot-progress-bar" id="bootProgress"></div></div>
    <div class="boot-caption">RAVAN مسیر کار را متناسب با نقش، انتخاب‌ها و ابزار هوش مصنوعی شما آماده می‌کند.</div>
  </div>
</div>
<script src="payload-1.js"></script>
<script src="payload-2a.js"></script>
<script src="payload-2b.js"></script>
<script src="payload-2c.js"></script>
<script src="payload-2d.js"></script>
<script src="payload-3.js"></script>
<script src="payload-4.js"></script>
<script src="payload-5.js"></script>
<script src="payload-6.js"></script>
<script src="payload-7.js"></script>
<script>
(async()=>{
  const BOOT_MIN_MS=2500;
  const bootStarted=window.__RAVAN_BOOT_STARTED_AT||performance.now();
  const boot=document.getElementById('boot');
  const bootStatus=document.getElementById('bootStatus');
  const bootProgress=document.getElementById('bootProgress');
  const bootSteps=[...document.querySelectorAll('[data-boot-step]')];
  const bootLabels=['بارگذاری پروفایل و تنظیمات','آماده‌سازی ابزارها و مسیر کاری','فضای کاری شما آماده است','ورود به RAVAN'];
  function setBootStage(stage){
    bootSteps.forEach((el,i)=>{
      el.classList.toggle('done',i<stage);
      el.classList.toggle('active',i===stage&&stage<3);
      const dot=el.querySelector('.boot-step-dot');
      if(dot)dot.textContent=i<stage?'✓':String(i+1).replace(/1/g,'۱').replace(/2/g,'۲').replace(/3/g,'۳');
    });
    if(bootStatus)bootStatus.textContent=bootLabels[Math.min(stage,3)];
    if(bootProgress)bootProgress.style.width=['16%','48%','82%','100%'][Math.min(stage,3)];
  }
  function scheduleStage(stage,at){
    const delay=Math.max(0,bootStarted+at-performance.now());
    setTimeout(()=>setBootStage(stage),delay);
  }
  setBootStage(0);
  scheduleStage(1,720);
  scheduleStage(2,1500);
  scheduleStage(3,2200);

  try {
    const bin=atob(window.__RAVAN_B64||"");
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    let html=await new Response(stream).text();

    /* Preserve the exact legacy workspace markup before the document is
       rewritten. The bridge can restore this original markup verbatim. */
    const wsId=html.indexOf('id="r11Workspace"');
    if(wsId>=0){
      const wsStart=html.lastIndexOf('<div',wsId);
      const wsEnd=html.indexOf('<script',wsId);
      window.__RAVAN_WORKSPACE_HTML=(wsStart>=0&&wsEnd>wsStart)?html.slice(wsStart,wsEnd).trim():'';
    }else{
      window.__RAVAN_WORKSPACE_HTML='';
    }

    /* Chrome was parsing the large first legacy inline runtime incorrectly
       after document.write(), which left all professional-form globals such as
       move(), openHomeV7(), previewMD(), settings/profile handlers, etc. absent.
       The source itself is valid. Externalize that exact runtime to a Blob URL
       and keep it in the same position so it executes as a classic blocking
       script with the original ordering, without passing its source through the
       HTML parser a second time. */
    const legacyRe=/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi;
    let legacyMatch=null,m;
    while((m=legacyRe.exec(html))){
      const code=m[1]||'';
      if(code.includes('function move(')&&code.includes('function openHomeV7(')&&code.includes('function previewMD(')){
        legacyMatch={full:m[0],code,index:m.index};
        break;
      }
    }
    if(legacyMatch){
      const runtimeUrl=URL.createObjectURL(new Blob([legacyMatch.code],{type:'text/javascript'}));
      window.__RAVAN_LEGACY_RUNTIME_URL=runtimeUrl;
      window.__RAVAN_LEGACY_RUNTIME_RECOVERY='19.16';
      const recoveredTag='<script src="'+runtimeUrl+'" data-ravan-legacy-runtime="19.16"><\/script>';
      html=html.slice(0,legacyMatch.index)+recoveredTag+html.slice(legacyMatch.index+legacyMatch.full.length);
    }else{
      window.__RAVAN_LEGACY_RUNTIME_RECOVERY='missing';
      console.error('[RAVAN] legacy runtime block was not found');
    }

    /* Legacy welcome/home must never flash before the consolidated bridge runs. */
    const legacyOverlayGuard='<style id="ravan-legacy-overlay-guard">#welcomeOverlay,#homeOverlayV7{display:none!important;visibility:hidden!important;pointer-events:none!important}</style>';
    const styles=legacyOverlayGuard+'<link rel="stylesheet" href="ravan-tokens-v19.css?v=19.17"><link rel="stylesheet" href="ravan-layout-v19.css?v=19.17"><link rel="stylesheet" href="ravan-components-v19.css?v=19.17"><link rel="stylesheet" href="ravan-sections-v19.css?v=19.17"><link rel="stylesheet" href="ravan-navigation-v19.css?v=19.20"><link rel="stylesheet" href="ravan-shell-fix-v19.css?v=19.21"><link rel="stylesheet" href="ravan-scroll-shell-v19.css?v=19.24">';
    const scripts='<script src="ravan-dynamic-v13.js?v=13.0"><\/script><script src="ravan-core-bridge-v19.js?v=19.26"><\/script><script src="ravan-ui-v19.js?v=19.17"><\/script><script src="ravan-a11y-v19.js?v=19.17"><\/script><script src="ravan-sections-v19.js?v=19.17"><\/script><script src="ravan-profile-management-v19.js?v=19.22"><\/script><script src="ravan-section-guides-v19.js?v=19.18"><\/script><script src="ravan-navigation-v19.js?v=19.20"><\/script>';
    html=html.replace('</head>',styles+'</head>').replace('</body>',scripts+'</body>');

    const remaining=Math.max(0,BOOT_MIN_MS-(performance.now()-bootStarted));
    if(remaining)await new Promise(resolve=>setTimeout(resolve,remaining));
    setBootStage(3);
    await new Promise(resolve=>setTimeout(resolve,180));
    if(boot)boot.classList.add('boot-ready');
    const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(!reduced)await new Promise(resolve=>setTimeout(resolve,230));
    document.open(); document.write(html); document.close();
  } catch(e) {
    if(boot){
      boot.classList.remove('boot-ready');
      boot.innerHTML='<div class="boot-shell"><div class="boot-brand">RAVAN AI</div><div class="boot-sub">مرورگر نتوانست برنامه را بارگذاری کند. لطفاً از نسخه جدید Chrome یا Edge استفاده کنید.</div></div>';
    }
    console.error(e);
  }
})();
</script>
</body>
</html>
