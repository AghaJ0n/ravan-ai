<script>
(async()=>{
  const BOOT_MIN_MS=3000;
  const bootStarted=window.__RAVAN_BOOT_STARTED_AT||performance.now();
  const boot=document.getElementById('boot');
  try {
    const bin=atob(window.__RAVAN_B64||"");
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    let html=await new Response(stream).text();

    /* RAVAN_ROLE_SPLIT_19_29 — split formerly combined roles before Core scripts execute. */
    const roleCatalogV1929="const r11Roles=[\n['teacher','📚','معلم','تدریس، طرح درس، آزمون و محتوای آموزشی'],['designer','🎨','طراح','Brief طراحی، رابط کاربری، ارائه و سیستم بصری'],['graphic_designer','🖌️','گرافیست','پوستر، بنر، هویت بصری و پرامپت تصویر'],['researcher','🔎','پژوهشگر','منابع، مرور ادبیات، تحلیل مقاله و گزارش پژوهشی'],['student','🎓','دانشجو','یادگیری دانشگاهی، پژوهش، خلاصه و ارائه'],['school_student','📘','دانش‌آموز','یادگیری درس، تمرین، آزمونک و برنامه مطالعه'],['manager','📊','مدیر','تصمیم‌گیری، گزارش، برنامه‌ریزی و جلسات'],['deputy','🏫','معاون','برنامه مدرسه، هماهنگی، گزارش و پیگیری'],['executive','📋','مسئول اجرایی','اجرای برنامه‌ها، پیگیری امور، گزارش و هماهنگی'],['creator','✍️','تولیدکننده محتوا','مقاله، شبکه اجتماعی، سناریو و تقویم محتوا'],['programmer','💻','برنامه‌نویس','کدنویسی، رفع خطا، مستندسازی و معماری'],['specialist','🧩','کارشناس','تحلیل، گزارش تخصصی، مستندسازی و پیگیری'],['admin','🗂️','کارمند اداری','نامه، صورت‌جلسه، فرم و گردش کار'],['other','＋','سایر','نقش دیگری دارم و خودم آن را مشخص می‌کنم']];";
    html=html.replace(/const r11Roles=\[[\s\S]*?\];\s*const r11Tasks=/,roleCatalogV1929+'\nconst r11Tasks=');
    html=html.replace("function r115TaskItems(){return (r11Tasks[r11State.role]||r11Tasks.other||[]).filter(x=>x[0]!=='other')}","function r115TaskItems(){const alias={school_student:'student',graphic_designer:'designer',executive:'deputy',specialist:'admin'};return (r11Tasks[alias[r11State.role]||r11State.role]||r11Tasks.other||[]).filter(x=>x[0]!=='other')}");

    /* Preserve the exact legacy workspace markup before the document is
       rewritten. The bridge can restore this original markup verbatim. */
    const wsId=html.indexOf('id="r11Workspace"');
    if(wsId>=0){
      const wsStart=html.lastIndexOf('<div',wsId);
      const wsEnd=html.indexOf('<script',wsId);
      window.__RAVAN_WORKSPACE_HTML=(wsStart>=0&&wsEnd>wsStart)?html.slice(wsStart,wsEnd).trim():'';
    }else{
      window.__RAVAN_WORKSPACE_HTML='';
    }

    /* Chrome was parsing the large first legacy inline runtime incorrectly
       after document.write(), which left all professional-form globals such as
       move(), openHomeV7(), previewMD(), settings/profile handlers, etc. absent.
       The source itself is valid. Externalize that exact runtime to a Blob URL
       and keep it in the same position so it executes as a classic blocking
       script with the original ordering, without passing its source through the
       HTML parser a second time. */
    const legacyRe=/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi;
    let legacyMatch=null,m;
    while((m=legacyRe.exec(html))){
      const code=m[1]||'';
      if(code.includes('function move(')&&code.includes('function openHomeV7(')&&code.includes('function previewMD(')){
        legacyMatch={full:m[0],code,index:m.index};
        break;
      }
    }
    if(legacyMatch){
      let legacyCode=legacyMatch.code;
      const expandedRoles="const r11Roles=[\n['teacher','📚','معلم','تدریس، طرح درس، آزمون و محتوای آموزشی'],['designer','🎨','طراح','Brief طراحی، رابط کاربری، ارائه و سیستم بصری'],['graphic_designer','🖌️','گرافیست','پوستر، بنر، هویت بصری و پرامپت تصویر'],['researcher','🔎','پژوهشگر','منابع، مرور ادبیات، تحلیل مقاله و گزارش پژوهشی'],['student','🎓','دانشجو','یادگیری دانشگاهی، پژوهش، خلاصه و ارائه'],['school_student','📘','دانش‌آموز','یادگیری درس، تمرین، آزمونک و برنامه مطالعه'],['manager','📊','مدیر','تصمیم‌گیری، گزارش، برنامه‌ریزی و جلسات'],['deputy','🏫','معاون','برنامه مدرسه، هماهنگی، گزارش و پیگیری'],['executive','📋','مسئول اجرایی','اجرای برنامه‌ها، پیگیری امور، گزارش و هماهنگی'],['creator','✍️','تولیدکننده محتوا','مقاله، شبکه اجتماعی، سناریو و تقویم محتوا'],['programmer','💻','برنامه‌نویس','کدنویسی، رفع خطا، مستندسازی و معماری'],['specialist','🧩','کارشناس','تحلیل، گزارش تخصصی، مستندسازی و پیگیری'],['admin','🗂️','کارمند اداری','نامه، صورت‌جلسه، فرم و گردش کار'],['other','＋','سایر','نقش دیگری دارم و خودم آن را مشخص می‌کنم']];";
      legacyCode=legacyCode.replace(/const r11Roles=\[[\s\S]*?\];\s*const r11Tasks=/,expandedRoles+'\nconst r11Tasks=');
      legacyCode=legacyCode.replace("function r115TaskItems(){return (r11Tasks[r11State.role]||r11Tasks.other||[]).filter(x=>x[0]!=='other')}","function r115TaskItems(){const alias={school_student:'student',graphic_designer:'designer',executive:'deputy',specialist:'admin'};return (r11Tasks[alias[r11State.role]||r11State.role]||r11Tasks.other||[]).filter(x=>x[0]!=='other')}");
      const runtimeUrl=URL.createObjectURL(new Blob([legacyCode],{type:'text/javascript'}));
      window.__RAVAN_LEGACY_RUNTIME_URL=runtimeUrl;
      window.__RAVAN_LEGACY_RUNTIME_RECOVERY='19.29';
      const recoveredTag='<script src="'+runtimeUrl+'" data-ravan-legacy-runtime="19.29"><\/script>';
      html=html.slice(0,legacyMatch.index)+recoveredTag+html.slice(legacyMatch.index+legacyMatch.full.length);
    }else{
      window.__RAVAN_LEGACY_RUNTIME_RECOVERY='missing';
      console.error('[RAVAN] legacy runtime block was not found');
    }

    /* Legacy welcome/home must never flash before the consolidated bridge runs. */
    const legacyOverlayGuard='<style id="ravan-legacy-overlay-guard">#welcomeOverlay,#homeOverlayV7{display:none!important;visibility:hidden!important;pointer-events:none!important}</style>';
    const styles=legacyOverlayGuard+'<link rel="stylesheet" href="ravan-tokens-v19.css?v=19.17"><link rel="stylesheet" href="ravan-layout-v19.css?v=19.17"><link rel="stylesheet" href="ravan-components-v19.css?v=19.17"><link rel="stylesheet" href="ravan-sections-v19.css?v=19.17"><link rel="stylesheet" href="ravan-navigation-v19.css?v=19.20"><link rel="stylesheet" href="ravan-shell-fix-v19.css?v=19.21"><link rel="stylesheet" href="ravan-scroll-shell-v19.css?v=19.24">';
    const scripts='<script src="ravan-dynamic-v13.js?v=13.1"><\/script><script src="ravan-core-bridge-v19.js?v=19.26"><\/script><script src="ravan-ui-v19.js?v=19.29"><\/script><script src="ravan-a11y-v19.js?v=19.17"><\/script><script src="ravan-sections-v19.js?v=19.17"><\/script><script src="ravan-profile-management-v19.js?v=19.22"><\/script><script src="ravan-section-guides-v19.js?v=19.18"><\/script><script src="ravan-navigation-v19.js?v=19.20"><\/script>';
    html=html.replace('</head>',styles+'</head>').replace('</body>',scripts+'</body>');

    const remaining=Math.max(0,BOOT_MIN_MS-(performance.now()-bootStarted));
    if(remaining)await new Promise(resolve=>setTimeout(resolve,remaining));
    if(boot)boot.classList.add('boot-ready');
    const reduced=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(!reduced)await new Promise(resolve=>setTimeout(resolve,370));
    document.open(); document.write(html); document.close();
  } catch(e) {
    if(boot){
      boot.classList.remove('boot-ready');
      boot.innerHTML='<div class="boot-logo"><div class="boot-brand">RAVAN AI</div><div class="boot-tagline">مرورگر نتوانست برنامه را بارگذاری کند. لطفاً از Chrome یا Edge جدید استفاده کنید.</div></div>';
    }
    console.error(e);
  }
})();
</script>
