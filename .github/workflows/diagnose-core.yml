name: Diagnose compressed Core
on:
  push:
    paths:
      - '.github/workflows/diagnose-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract focused Core snippets
        shell: python
        run: |
          import base64, gzip, pathlib, re
          order = ['payload-1.js','payload-2a.js','payload-2b.js','payload-2c.js','payload-2d.js','payload-3.js','payload-4.js','payload-5.js','payload-6.js','payload-7.js']
          chunks=[]
          for fn in order:
              txt=pathlib.Path(fn).read_text(encoding='utf-8')
              found=re.findall(r'\+\s*"([A-Za-z0-9+/=]+)"', txt)
              if not found: raise SystemExit(f'No payload chunk found in {fn}')
              chunks.extend(found)
          core=gzip.decompress(base64.b64decode(''.join(chunks))).decode('utf-8')
          terms=['function buildWs','r11Workspace.classList','function r113BackFromWorkspace','r11Gate.style','r11Workspace','const r11Workspace','let r11Workspace']
          for term in terms:
              print('\n===== TERM:', term, '=====')
              starts=[m.start() for m in re.finditer(re.escape(term),core,re.I)]
              print('COUNT',len(starts))
              for i,pos in enumerate(starts[:8],1):
                  a=max(0,pos-2400); b=min(len(core),pos+4200)
                  print(f'\n--- hit {i} @ {pos} ---\n{core[a:b]}\n--- end hit ---')
