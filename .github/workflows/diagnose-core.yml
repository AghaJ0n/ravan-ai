name: Diagnose compressed Core
on:
  push:
    paths:
      - '.github/workflows/diagnose-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract focused Core snippets
        shell: python
        run: |
          import base64, gzip, pathlib, re
          order = ['payload-1.js','payload-2a.js','payload-2b.js','payload-2c.js','payload-2d.js','payload-3.js','payload-4.js','payload-5.js','payload-6.js','payload-7.js']
          chunks=[]
          for fn in order:
              txt=pathlib.Path(fn).read_text(encoding='utf-8')
              found=re.findall(r'\+\s*"([A-Za-z0-9+/=]+)"', txt)
              if not found:
                  raise SystemExit(f'No payload chunk found in {fn}')
              chunks.extend(found)
          blob=base64.b64decode(''.join(chunks))
          core=gzip.decompress(blob).decode('utf-8')
          print('CORE_LENGTH', len(core))
          terms=['ساخت فضای کاری من','r11-ws-shell','r11-gate','r11-ai','workspace','addEventListener']
          for term in terms:
              print('\n===== TERM:', term, '=====')
              starts=[m.start() for m in re.finditer(re.escape(term),core,re.I)]
              print('COUNT',len(starts))
              for i,pos in enumerate(starts[:12],1):
                  a=max(0,pos-1800); b=min(len(core),pos+2600)
                  print(f'\n--- hit {i} @ {pos} ---\n{core[a:b]}\n--- end hit ---')
