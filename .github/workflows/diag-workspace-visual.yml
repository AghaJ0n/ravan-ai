name: Diagnose workspace visual
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diag-workspace-visual.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium
        run: python -m pip install -q selenium
      - name: Assert visible workspace state
        shell: bash
        run: |
          python -m http.server 8765 >/tmp/ravan-http.log 2>&1 &
          sleep 2
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          import time,json,sys
          o=Options(); o.add_argument('--headless=new'); o.add_argument('--no-sandbox'); o.add_argument('--disable-dev-shm-usage'); o.add_argument('--window-size=1650,930')
          o.set_capability('goog:loggingPrefs', {'browser':'ALL'})
          d=webdriver.Chrome(options=o)
          try:
            d.get('http://127.0.0.1:8765/?diag=transition-19.13')
            time.sleep(2)
            d.execute_script("r112PickRole('teacher'); r11Move(1); r115PickTask('lesson'); r11Move(1); selectAi('chatgpt'); r11Move(1)")
            time.sleep(1.2)
            state=d.execute_script("""
              const w=document.getElementById('r11Workspace'),g=document.querySelector('.r11-gate');
              const s=w&&getComputedStyle(w),r=w&&w.getBoundingClientRect();
              return {
                ui:document.documentElement.dataset.ravanUi||'',
                bridge:document.documentElement.dataset.ravanBridgeLoaded||'',
                root:document.documentElement.className,
                wsClass:w?.className||'', wsDisplay:s?.display||'', wsPosition:s?.position||'',
                wsWidth:r?.width||0, wsHeight:r?.height||0,
                gateDisplay:g?getComputedStyle(g).display:'',
                fields:document.querySelectorAll('#r11DynamicFields .r11-field').length,
                progress:document.querySelector('#r19Progress')?.innerText||'',
                help:document.querySelector('#r19Help')?.innerText||'',
                title:document.querySelector('#r11Workspace .r11-ws-top h1')?.textContent||''
              };
            """)
            print('STATE',json.dumps(state,ensure_ascii=False))
            d.save_screenshot('/tmp/workspace.png')
            errors=[]
            if state['wsDisplay']!='block': errors.append('workspace display is not block')
            if state['wsPosition']!='static': errors.append('workspace is not in document flow')
            if state['wsWidth']<500 or state['wsHeight']<300: errors.append('workspace has no useful visible size')
            if state['gateDisplay']!='none': errors.append('builder gate still visible')
            if state['fields']<1: errors.append('dynamic workspace fields missing')
            if 'r19-workspace-active' not in state['root']: errors.append('workspace-active state missing')
            if '100%' not in state['progress'] or 'گام 4 از ۴' not in state['progress'] and 'گام ۴ از ۴' not in state['progress']: errors.append('progress is not step 4 / 100%')
            if 'ساخت خروجی برای AI' not in state['help']: errors.append('next action help missing')
            for row in d.get_log('browser'): print('BROWSER_LOG',json.dumps(row,ensure_ascii=False))
            if errors:
              print('ASSERT_FAIL',errors)
              sys.exit(1)
            print('ASSERT_PASS visible workspace, step 4, 100 percent')
          finally:d.quit()
          PY
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-visual
          path: /tmp/workspace.png
