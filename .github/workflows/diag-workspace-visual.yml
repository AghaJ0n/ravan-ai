name: Diagnose workspace visual
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diag-workspace-visual.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium
        run: python -m pip install -q selenium
      - name: Inspect workspace after real clicks
        shell: bash
        run: |
          python -m http.server 8765 >/tmp/ravan-http.log 2>&1 &
          sleep 2
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          import time,json
          o=Options(); o.add_argument('--headless=new'); o.add_argument('--no-sandbox'); o.add_argument('--disable-dev-shm-usage'); o.add_argument('--window-size=1650,930')
          o.set_capability('goog:loggingPrefs', {'browser':'ALL'})
          d=webdriver.Chrome(options=o)
          def click_contains(selector,text):
            return d.execute_script("""
              const els=[...document.querySelectorAll(arguments[0])];
              const el=els.find(x=>x.textContent.includes(arguments[1]) && getComputedStyle(x).display!=='none');
              if(!el)return null; el.click(); return el.textContent.trim();
            """,selector,text)
          try:
            d.get('http://127.0.0.1:8765/?diag=real-19.13')
            time.sleep(2)
            print('UI',d.execute_script("return document.documentElement.dataset.ravanUi||''"))
            print('BRIDGE',d.execute_script("return document.documentElement.dataset.ravanBridgeLoaded||''"))
            print('ROLE_CLICK',click_contains('.r112-role-option','معلم'))
            time.sleep(.3)
            print('NEXT1',click_contains('button','مرحله بعد'))
            time.sleep(.4)
            print('TASK_CLICK',click_contains('.r115-task-option','آزمون'))
            time.sleep(.3)
            print('NEXT2',click_contains('button','مرحله بعد'))
            time.sleep(.4)
            print('AI_CLICK',click_contains('.r11-ai','ChatGPT'))
            time.sleep(.4)
            print('BUILD_BUTTON',click_contains('button','ساخت فضای کاری من'))
            time.sleep(1)
            print('WS',d.execute_script("var w=document.getElementById('r11Workspace'),s=w&&getComputedStyle(w);return w?{class:w.className,display:s.display,position:s.position,width:s.width,height:s.height,rect:w.getBoundingClientRect().toJSON(),parent:w.parentElement&&w.parentElement.className,fields:document.querySelectorAll('#r11DynamicFields .r11-field').length}:null"))
            print('ROOT_CLASS',d.execute_script("return document.documentElement.className"))
            print('GATE_DISPLAY',d.execute_script("var g=document.querySelector('.r11-gate');return g&&getComputedStyle(g).display"))
            print('PROGRESS',d.execute_script("return document.querySelector('#r19Progress')?.innerText||''"))
            print('HELP',d.execute_script("return document.querySelector('#r19Help')?.innerText||''"))
            print('WORKSPACE_TEXT',d.execute_script("return document.getElementById('r11Workspace')?.innerText.slice(0,900)||''"))
            d.save_screenshot('/tmp/workspace.png')
            for row in d.get_log('browser'): print('BROWSER_LOG',json.dumps(row,ensure_ascii=False))
          finally:d.quit()
          PY
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workspace-visual
          path: /tmp/workspace.png
