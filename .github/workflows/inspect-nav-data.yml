name: Inspect nav data
on:
  push:
    paths:
      - '.github/workflows/inspect-nav-data.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect all storage keys
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),zlib=require('zlib');
          const files=['payload-1.js','payload-2a.js','payload-2b.js','payload-2c.js','payload-2d.js','payload-3.js','payload-4.js','payload-5.js','payload-6.js','payload-7.js'];
          let b64='';for(const f of files){const s=fs.readFileSync(f,'utf8');const m=s.match(/\+\"([A-Za-z0-9+/=]+)\"\s*;?\s*$/s);if(!m)throw new Error(f);b64+=m[1];}
          const html=zlib.gunzipSync(Buffer.from(b64,'base64')).toString('utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
          scripts.forEach((code,i)=>{
            console.log('\n### SCRIPT',i+1,'LEN',code.length);
            const keys=[...code.matchAll(/localStorage\.(?:getItem|setItem|removeItem)\((['"`])([^'"`]+)\1/g)].map(m=>m[2]);
            console.log('STATIC_KEYS',JSON.stringify([...new Set(keys)].sort()));
            for(const term of ['localStorage','profile','profiles','project','Project','پروفایل','پروژه']){
              let pos=0,c=0;while((pos=code.indexOf(term,pos))>=0&&c<12){console.log(term,pos,code.slice(Math.max(0,pos-130),pos+350).replace(/\n/g,' ↵ '));pos+=term.length;c++;}
            }
          });
          NODE
