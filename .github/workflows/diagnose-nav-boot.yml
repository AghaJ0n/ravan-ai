name: Diagnose nav bootstrap
on:
  push:
    paths:
      - '.github/workflows/diagnose-nav-boot.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q selenium
      - name: Trace bootstrap timing
        shell: bash
        run: |
          python -m http.server 8765 >/tmp/ravan-http.log 2>&1 &
          sleep 2
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          import time,json
          o=Options();o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage');o.add_argument('--window-size=1650,930')
          o.set_capability('goog:loggingPrefs', {'browser':'ALL'})
          d=webdriver.Chrome(options=o)
          try:
            d.get('http://127.0.0.1:8765/?diag=19.20')
            elapsed=0
            for delay in [2,3,5,10]:
              time.sleep(delay);elapsed+=delay
              state=d.execute_script("return {ready:document.readyState,title:document.title,body:(document.body?.innerText||'').slice(0,500),nav:document.querySelectorAll('.r19-nav').length,items:document.querySelectorAll('.r19-navitem').length,app:document.querySelectorAll('.r19-app').length,marker:document.documentElement.dataset.ravanPersistentNav||'',ui:document.documentElement.dataset.ravanUi||'',bridge:document.documentElement.dataset.ravanBridgeLoaded||'',scripts:[...document.scripts].map(s=>s.src||'[inline]').slice(-12)}")
              print('STATE',elapsed,json.dumps(state,ensure_ascii=False))
              for row in d.get_log('browser'): print('LOG',elapsed,json.dumps(row,ensure_ascii=False))
            print('HTTP_LOG');print(open('/tmp/ravan-http.log').read())
          finally:d.quit()
          PY
