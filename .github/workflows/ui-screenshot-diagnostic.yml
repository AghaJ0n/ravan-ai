name: RAVAN UI screenshot diagnostic
on:
  push:
    paths:
      - '.github/workflows/ui-screenshot-diagnostic.yml'
      - 'index.html'
      - 'ravan-shell-fix-v19.css'
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q selenium
      - name: Capture and verify desktop UI
        shell: bash
        run: |
          python -m http.server 8765 >/tmp/ravan-http.log 2>&1 &
          sleep 2
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support import expected_conditions as EC
          import time,json,sys
          o=Options();o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage');o.add_argument('--window-size=1650,930')
          d=webdriver.Chrome(options=o)
          try:
            d.get('http://127.0.0.1:8765/?screenshot=19.21')
            WebDriverWait(d,20).until(EC.presence_of_element_located((By.CSS_SELECTOR,'.r19-nav')))
            time.sleep(1)
            state=d.execute_script("""
              const pick=s=>{const e=document.querySelector(s);if(!e)return null;const r=e.getBoundingClientRect(),c=getComputedStyle(e);return {s,rect:[r.x,r.y,r.width,r.height],pos:c.position,z:c.zIndex,display:c.display,opacity:c.opacity,visibility:c.visibility};};
              const nav=document.querySelector('.r19-nav'), nr=nav.getBoundingClientRect();
              const hit=document.elementFromPoint(nr.left+nr.width/2,nr.top+80);
              return {nav:pick('.r19-nav'),top:pick('.r19-topbar'),gate:pick('.r11-gate'),main:pick('.r19-main'),ctx:pick('.r19-context'),hit:[hit?.tagName||'',hit?.className||'',hit?.id||''],hitInsideNav:!!hit?.closest?.('.r19-nav'),items:[...document.querySelectorAll('.r19-navitem')].filter(x=>getComputedStyle(x).display!='none').length};
            """)
            print('VISUAL_STATE',json.dumps(state,ensure_ascii=False))
            d.save_screenshot('ravan-ui-19.21.png')
            ok=(state['gate']['pos']=='static' and state['gate']['z']=='auto' and state['hitInsideNav'] and state['items']==6 and state['top']['display']!='none' and state['ctx']['display']!='none')
            if not ok: sys.exit('Shell is still visually covered')
          finally:
            d.quit()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ravan-ui-19.21
          path: ravan-ui-19.21.png
