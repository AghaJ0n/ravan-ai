name: Diagnose all controls
on:
  push:
    paths:
      - '.github/workflows/diag-all-controls.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q selenium
      - name: Inspect professional controls
        shell: bash
        run: |
          python -m http.server 8765 >/tmp/ravan-http.log 2>&1 &
          sleep 2
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          import json,time
          o=Options();o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage');o.add_argument('--window-size=1650,930')
          o.set_capability('goog:loggingPrefs', {'browser':'ALL'})
          d=webdriver.Chrome(options=o)
          try:
            d.get('http://127.0.0.1:8765/?diag=inventory')
            time.sleep(2)
            d.execute_script("r112PickRole('teacher'); r11Move(1); r115PickTask('lesson'); r11Move(1); selectAi('chatgpt'); r11Move(1); document.querySelector('#r11TeacherAdvanced button').click()")
            time.sleep(.5)
            report=d.execute_script(r'''return (()=>{
              const h=document.getElementById('r19ProfessionalHost');
              const onclicks=[...h.querySelectorAll('[onclick]')].map(e=>({tag:e.tagName,id:e.id||'',cls:String(e.className||''),text:(e.innerText||e.getAttribute('aria-label')||'').trim().slice(0,90),onclick:e.getAttribute('onclick')||''}));
              const names=[...new Set(onclicks.flatMap(x=>[...x.onclick.matchAll(/\b([A-Za-z_$][\w$]*)\s*\(/g)].map(m=>m[1])).filter(n=>!['getElementById','querySelector','preventDefault'].includes(n)))];
              const globals={};for(const n of names)globals[n]=typeof window[n];
              const structural=[...h.querySelectorAll('[id]')].filter(e=>/modal|overlay|profile|setting|home|preview|quality|library|toast|summary|output|source|project/i.test(e.id)).map(e=>({tag:e.tagName,id:e.id,cls:String(e.className||''),display:getComputedStyle(e).display,hidden:e.hidden,text:(e.innerText||'').trim().slice(0,180)}));
              return {onclicks,globals,structural};
            })()''')
            print('INVENTORY',json.dumps(report,ensure_ascii=False))
            for row in d.get_log('browser'): print('BROWSER_LOG',json.dumps(row,ensure_ascii=False))
          finally:d.quit()
          PY
