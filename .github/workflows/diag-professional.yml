name: Diagnose professional form
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diag-professional.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium
        run: python -m pip install -q selenium
      - name: Test professional form open and return
        shell: bash
        run: |
          python -m http.server 8765 >/tmp/ravan-http.log 2>&1 &
          sleep 2
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          import time,json,sys
          o=Options(); o.add_argument('--headless=new'); o.add_argument('--no-sandbox'); o.add_argument('--disable-dev-shm-usage'); o.add_argument('--window-size=1650,930')
          o.set_capability('goog:loggingPrefs', {'browser':'ALL'})
          d=webdriver.Chrome(options=o)
          try:
            d.get('http://127.0.0.1:8765/?diag=professional-19.15')
            time.sleep(2)
            d.execute_script("r112PickRole('teacher'); r11Move(1); r115PickTask('lesson'); r11Move(1); selectAi('chatgpt'); r11Move(1)")
            time.sleep(1)
            btn=d.find_element(By.CSS_SELECTOR,'#r11TeacherAdvanced button')
            print('BUTTON',btn.text,btn.is_displayed())
            d.execute_script("arguments[0].scrollIntoView({block:'center'}); arguments[0].click();",btn)
            time.sleep(1)
            state=d.execute_script("""
              const h=document.getElementById('r19ProfessionalHost');
              const app=h&&h.querySelector('.app');
              const w=document.getElementById('r11Workspace');
              const hs=h&&getComputedStyle(h),as=app&&getComputedStyle(app),ar=app&&app.getBoundingClientRect();
              return {bridge:document.documentElement.dataset.ravanBridgeLoaded||'',proBridge:document.documentElement.dataset.ravanProfessionalBridge||'',root:document.documentElement.className,hostHidden:h?.hidden,hostDisplay:hs?.display||'',appDisplay:as?.display||'',appWidth:ar?.width||0,appHeight:ar?.height||0,workspaceDisplay:w?getComputedStyle(w).display:'',text:(app?.innerText||'').slice(0,700),back:!!document.getElementById('r19ProfessionalBack')};
            """)
            print('OPEN_STATE',json.dumps(state,ensure_ascii=False))
            d.save_screenshot('/tmp/professional-open.png')
            errors=[]
            if state['bridge']!='19.15': errors.append('v19.15 bridge not loaded')
            if 'r19-professional-active' not in state['root']: errors.append('professional root state missing')
            if state['hostHidden'] or state['hostDisplay']=='none': errors.append('professional host hidden')
            if state['appDisplay']=='none' or state['appWidth']<700 or state['appHeight']<500: errors.append('legacy professional app not visibly rendered')
            if state['workspaceDisplay']!='none': errors.append('workspace still visible in professional mode')
            if not state['back']: errors.append('RAVAN return button missing')
            d.execute_script("document.getElementById('r19ProfessionalBack').click()")
            time.sleep(.5)
            returned=d.execute_script("""
              const h=document.getElementById('r19ProfessionalHost'),w=document.getElementById('r11Workspace');
              return {root:document.documentElement.className,hostHidden:h?.hidden,workspaceDisplay:w?getComputedStyle(w).display:'',workspaceOpen:w?.classList.contains('open')};
            """)
            print('RETURN_STATE',json.dumps(returned,ensure_ascii=False))
            if 'r19-professional-active' in returned['root']: errors.append('professional state remained after back')
            if not returned['hostHidden']: errors.append('professional host remained visible after back')
            if returned['workspaceDisplay']!='block' or not returned['workspaceOpen']: errors.append('workspace not restored after back')
            for row in d.get_log('browser'): print('BROWSER_LOG',json.dumps(row,ensure_ascii=False))
            if errors:
              print('ASSERT_FAIL',errors);sys.exit(1)
            print('ASSERT_PASS professional form opens visibly and returns to workspace')
          finally:d.quit()
          PY
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: professional-form-visual
          path: /tmp/professional-open.png
