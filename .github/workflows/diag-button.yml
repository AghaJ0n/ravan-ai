name: Diagnose workspace button
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diag-button.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect generated sources
        shell: python
        run: |
          import base64,gzip,pathlib,re
          order=['payload-1.js','payload-2a.js','payload-2b.js','payload-2c.js','payload-2d.js','payload-3.js','payload-4.js','payload-5.js','payload-6.js','payload-7.js']
          chunks=[]
          for fn in order:
            txt=pathlib.Path(fn).read_text(encoding='utf-8')
            chunks += re.findall(r'\+\s*"([A-Za-z0-9+/=]+)"',txt)
          core=gzip.decompress(base64.b64decode(''.join(chunks))).decode('utf-8')
          lines=core.splitlines()
          print('===== CORE LINES 112-126 =====')
          for i in range(111,min(126,len(lines))): print(f'{i+1}: {lines[i]}')
          print('===== CORE WORKSPACE POS =====',core.find('id="r11Workspace"'))
          print('===== CORE DYNAMIC SCRIPT POS =====',core.find('ravan-dynamic'))

          txt=pathlib.Path('ravan-dynamic-v13.js').read_text(encoding='utf-8')
          m=re.search(r'atob\("([A-Za-z0-9+/=]+)"\)',txt)
          if not m:
            print('NO_DYNAMIC_B64'); raise SystemExit
          raw=base64.b64decode(m.group(1))
          try: dyn=gzip.decompress(raw).decode('utf-8')
          except Exception:
            try: dyn=raw.decode('utf-8')
            except Exception as e: print('DYNAMIC_DECODE_FAIL',repr(e)); raise
          print('===== DYNAMIC LENGTH =====',len(dyn))
          for term in ['r11Workspace','r11-ws-shell','r11-workspace','innerHTML','document.body','remove()','removeChild','replaceChildren','appendChild']:
            print('\n===== DYNAMIC TERM',term,'=====')
            hits=list(re.finditer(re.escape(term),dyn,re.I))
            print('COUNT',len(hits))
            for h in hits[:12]:
              a=max(0,h.start()-1000);b=min(len(dyn),h.start()+2200)
              print(dyn[a:b])
