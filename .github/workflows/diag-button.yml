name: Diagnose workspace button
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diag-button.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium
        run: python -m pip install -q selenium
      - name: Run browser click test
        shell: bash
        run: |
          python -m http.server 8765 >/tmp/ravan-http.log 2>&1 &
          sleep 2
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          import time,json
          o=Options(); o.add_argument('--headless=new'); o.add_argument('--no-sandbox'); o.add_argument('--disable-dev-shm-usage'); o.add_argument('--window-size=1440,1000')
          o.set_capability('goog:loggingPrefs', {'browser':'ALL'})
          d=webdriver.Chrome(options=o)
          try:
            d.get('http://127.0.0.1:8765/?diag=1')
            time.sleep(2)
            print('TITLE',d.title)
            print('BRIDGE',d.execute_script("return document.documentElement.dataset.ravanWorkspaceBridge||''"))
            print('UI',d.execute_script("return document.documentElement.dataset.ravanUi||''"))
            print('WORKSPACE_CONNECTED',d.execute_script("var w=document.getElementById('r11Workspace');return !!w&&w.isConnected"))
            print('WORKSPACE_PARENT',d.execute_script("var w=document.getElementById('r11Workspace');return w&&w.parentElement&&w.parentElement.className"))
            d.execute_script("r112PickRole('teacher'); r11Move(1)")
            d.execute_script("r115PickTask('lesson'); r11Move(1)")
            d.execute_script("selectAi('chatgpt')")
            time.sleep(.3)
            print('STEP_BEFORE',d.execute_script("return r11State.step"))
            print('AI_BEFORE',d.execute_script("return r11State.ai"))
            btn=d.find_element(By.ID,'r11Next')
            print('BUTTON_TEXT',btn.text)
            print('BUTTON_DISPLAYED',btn.is_displayed())
            try:
              btn.click()
              print('CLICK_SENT yes')
            except Exception as e:
              print('CLICK_EXCEPTION',repr(e))
            time.sleep(1)
            print('WS_CLASS',d.execute_script("var w=document.getElementById('r11Workspace');return w&&w.className"))
            print('WS_DISPLAY',d.execute_script("var w=document.getElementById('r11Workspace');return w&&getComputedStyle(w).display"))
            print('GATE_DISPLAY',d.execute_script("var g=document.querySelector('.r11-gate');return g&&getComputedStyle(g).display"))
            print('DYNAMIC_CHILDREN',d.execute_script("var x=document.getElementById('r11DynamicFields');return x?x.children.length:-1"))
            print('BODY_TEXT_HAS_WORKSPACE',d.execute_script("return document.body.innerText.includes('فضای کاری معلم')"))
            for row in d.get_log('browser'):
              print('BROWSER_LOG',json.dumps(row,ensure_ascii=False))
          finally:
            d.quit()
          PY
