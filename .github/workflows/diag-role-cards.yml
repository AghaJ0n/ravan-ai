name: RAVAN role split hotfix
on:
  push:
    paths:
      - '.github/workflows/diag-role-cards.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch decompressed core role catalog
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs');
          let index=fs.readFileSync('index.html','utf8');
          const anchor="    let html=await new Response(stream).text();";
          if(!index.includes(anchor)) throw new Error('decompression anchor not found');
          if(!index.includes('RAVAN_ROLE_SPLIT_19_29')){
            const patch=`\n\n    /* RAVAN_ROLE_SPLIT_19_29 — split formerly combined roles before Core scripts execute. */\n    const roleCatalogV1929=\"const r11Roles=[\\n['teacher','📚','معلم','تدریس، طرح درس، آزمون و محتوای آموزشی'],['designer','🎨','طراح','Brief طراحی، رابط کاربری، ارائه و سیستم بصری'],['graphic_designer','🖌️','گرافیست','پوستر، بنر، هویت بصری و پرامپت تصویر'],['researcher','🔎','پژوهشگر','منابع، مرور ادبیات، تحلیل مقاله و گزارش پژوهشی'],['student','🎓','دانشجو','یادگیری دانشگاهی، پژوهش، خلاصه و ارائه'],['school_student','📘','دانش‌آموز','یادگیری درس، تمرین، آزمونک و برنامه مطالعه'],['manager','📊','مدیر','تصمیم‌گیری، گزارش، برنامه‌ریزی و جلسات'],['deputy','🏫','معاون','برنامه مدرسه، هماهنگی، گزارش و پیگیری'],['executive','📋','مسئول اجرایی','اجرای برنامه‌ها، پیگیری امور، گزارش و هماهنگی'],['creator','✍️','تولیدکننده محتوا','مقاله، شبکه اجتماعی، سناریو و تقویم محتوا'],['programmer','💻','برنامه‌نویس','کدنویسی، رفع خطا، مستندسازی و معماری'],['specialist','🧩','کارشناس','تحلیل، گزارش تخصصی، مستندسازی و پیگیری'],['admin','🗂️','کارمند اداری','نامه، صورت‌جلسه، فرم و گردش کار'],['other','＋','سایر','نقش دیگری دارم و خودم آن را مشخص می‌کنم']];\";\n    html=html.replace(/const r11Roles=\\[[\\s\\S]*?\\];\\s*const r11Tasks=/,roleCatalogV1929+'\\nconst r11Tasks=');\n    html=html.replace(\"function r115TaskItems(){return (r11Tasks[r11State.role]||r11Tasks.other||[]).filter(x=>x[0]!=='other')}\",\"function r115TaskItems(){const alias={school_student:'student',graphic_designer:'designer',executive:'deputy',specialist:'admin'};return (r11Tasks[alias[r11State.role]||r11State.role]||r11Tasks.other||[]).filter(x=>x[0]!=='other')}\");`;
            index=index.replace(anchor,anchor+patch);
          }
          fs.writeFileSync('index.html',index);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Inject separated roles into decompressed core"
          git push
