name: RAVAN role card diagnostic
on:
  push:
    paths:
      - '.github/workflows/diag-role-cards.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect decompressed role source
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),zlib=require('zlib');
          global.window={};
          for(const f of ['payload-1.js','payload-2a.js','payload-2b.js','payload-2c.js','payload-2d.js','payload-3.js','payload-4.js','payload-5.js','payload-6.js','payload-7.js']){
            vm.runInThisContext(fs.readFileSync(f,'utf8'),{filename:f});
          }
          const html=zlib.gunzipSync(Buffer.from(window.__RAVAN_B64,'base64')).toString('utf8');
          for(const needle of ['r11Roles','function renderRoles','function renderTasks']){
            const i=html.indexOf(needle);console.log('\n===',needle,'@',i,'===\n',html.slice(Math.max(0,i-700),i+2600));
          }
          NODE
