name: RAVAN role split apply
on:
  push:
    paths:
      - '.github/workflows/diag-role-cards.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply role split to production files
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),zlib=require('zlib');

          let index=fs.readFileSync('index.html','utf8');
          const oldBlock=`    if(legacyMatch){\n      const runtimeUrl=URL.createObjectURL(new Blob([legacyMatch.code],{type:'text/javascript'}));\n      window.__RAVAN_LEGACY_RUNTIME_URL=runtimeUrl;\n      window.__RAVAN_LEGACY_RUNTIME_RECOVERY='19.16';\n      const recoveredTag='<script src="'+runtimeUrl+'" data-ravan-legacy-runtime="19.16"><\\/script>';`;
          const newBlock=`    if(legacyMatch){\n      let legacyCode=legacyMatch.code;\n      const expandedRoles=\"const r11Roles=[\\n['teacher','📚','معلم','تدریس، طرح درس، آزمون و محتوای آموزشی'],['designer','🎨','طراح','Brief طراحی، رابط کاربری، ارائه و سیستم بصری'],['graphic_designer','🖌️','گرافیست','پوستر، بنر، هویت بصری و پرامپت تصویر'],['researcher','🔎','پژوهشگر','منابع، مرور ادبیات، تحلیل مقاله و گزارش پژوهشی'],['student','🎓','دانشجو','یادگیری دانشگاهی، پژوهش، خلاصه و ارائه'],['school_student','📘','دانش‌آموز','یادگیری درس، تمرین، آزمونک و برنامه مطالعه'],['manager','📊','مدیر','تصمیم‌گیری، گزارش، برنامه‌ریزی و جلسات'],['deputy','🏫','معاون','برنامه مدرسه، هماهنگی، گزارش و پیگیری'],['executive','📋','مسئول اجرایی','اجرای برنامه‌ها، پیگیری امور، گزارش و هماهنگی'],['creator','✍️','تولیدکننده محتوا','مقاله، شبکه اجتماعی، سناریو و تقویم محتوا'],['programmer','💻','برنامه‌نویس','کدنویسی، رفع خطا، مستندسازی و معماری'],['specialist','🧩','کارشناس','تحلیل، گزارش تخصصی، مستندسازی و پیگیری'],['admin','🗂️','کارمند اداری','نامه، صورت‌جلسه، فرم و گردش کار'],['other','＋','سایر','نقش دیگری دارم و خودم آن را مشخص می‌کنم']];\";\n      legacyCode=legacyCode.replace(/const r11Roles=\\[[\\s\\S]*?\\];\\s*const r11Tasks=/,expandedRoles+'\\nconst r11Tasks=');\n      legacyCode=legacyCode.replace(\"function r115TaskItems(){return (r11Tasks[r11State.role]||r11Tasks.other||[]).filter(x=>x[0]!=='other')}\",\"function r115TaskItems(){const alias={school_student:'student',graphic_designer:'designer',executive:'deputy',specialist:'admin'};return (r11Tasks[alias[r11State.role]||r11State.role]||r11Tasks.other||[]).filter(x=>x[0]!=='other')}\");\n      const runtimeUrl=URL.createObjectURL(new Blob([legacyCode],{type:'text/javascript'}));\n      window.__RAVAN_LEGACY_RUNTIME_URL=runtimeUrl;\n      window.__RAVAN_LEGACY_RUNTIME_RECOVERY='19.29';\n      const recoveredTag='<script src="'+runtimeUrl+'" data-ravan-legacy-runtime="19.29"><\\/script>';`;
          if(!index.includes(oldBlock)) throw new Error('index legacy runtime block not found');
          index=index.replace(oldBlock,newBlock)
            .replace('ravan-dynamic-v13.js?v=13.0','ravan-dynamic-v13.js?v=13.1')
            .replace('ravan-ui-v19.js?v=19.17','ravan-ui-v19.js?v=19.29');
          fs.writeFileSync('index.html',index);

          let dyn=fs.readFileSync('ravan-dynamic-v13.js','utf8');
          const m=dyn.match(/atob\("([A-Za-z0-9+/=]+)"\)/);
          if(!m) throw new Error('dynamic payload not found');
          let code=zlib.gunzipSync(Buffer.from(m[1],'base64')).toString('utf8');
          if(!code.includes('const ROLE_ALIAS=')){
            code=code.replace("'use strict';","'use strict'; const ROLE_ALIAS={school_student:'student',graphic_designer:'designer',executive:'deputy',specialist:'admin'}; const baseRole=()=>ROLE_ALIAS[r11State.role]||r11State.role;");
            code=code.replace('function roleFields(){return ROLE[r11State.role]||ROLE.other;}','function roleFields(){return ROLE[baseRole()]||ROLE.other;}');
            code=code.replace('const exact=TASK[`${r11State.role}:${r11State.task}`];','const exact=TASK[`${baseRole()}:${r11State.task}`];');
            code=code.replace('const key=`${r11State.role}:${r11State.task}:${r11State.ai}`;','const key=`${baseRole()}:${r11State.task}:${r11State.ai}`;');
          }
          const b64=zlib.gzipSync(Buffer.from(code,'utf8')).toString('base64');
          dyn=dyn.replace(/atob\("[A-Za-z0-9+/=]+"\)/,'atob("'+b64+'")');
          fs.writeFileSync('ravan-dynamic-v13.js',dyn);

          let ui=fs.readFileSync('ravan-ui-v19.js','utf8');
          ui=ui.replace(" 'کسب‌وکار':['مدیر','کسب','بازاری','محصول','فروش','کارآفرین','مشاور'],"," 'کسب‌وکار':['مدیر','کسب','بازاری','محصول','فروش','کارآفرین','مشاور','مسئول اجرایی','اجرایی','کارشناس','کارمند','اداری'],")
               .replace(" 'آموزش':['معلم','دانش','آموز','استاد','آموزش'],"," 'آموزش':['معلم','دانش','آموز','استاد','آموزش','معاون','مدرسه'],")
               .replace(" 'طراحی و خلاقیت':['طراح','گرافیک','هنر','خلاق'],"," 'طراحی و خلاقیت':['طراح','گرافیک','گرافیست','بصری','هنر','خلاق'],")
               .replace('/طراح|گرافیک|هنر|خلاق/.test(t)','/طراح|گرافیک|گرافیست|هنر|خلاق/.test(t)');
          fs.writeFileSync('ravan-ui-v19.js',ui);
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html ravan-dynamic-v13.js ravan-ui-v19.js
          git commit -m "Split combined roles into independent categories"
          git push
