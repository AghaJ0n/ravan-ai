name: RAVAN role card diagnostic
on:
  push:
    paths:
      - '.github/workflows/diag-role-cards.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect dynamic role routing
        shell: bash
        run: |
          node - <<'NODE'
          const fs=require('fs'),zlib=require('zlib');
          const src=fs.readFileSync('ravan-dynamic-v13.js','utf8');
          const m=src.match(/atob\("([A-Za-z0-9+/=]+)"\)/);
          if(!m)throw new Error('dynamic base64 not found');
          const code=zlib.gunzipSync(Buffer.from(m[1],'base64')).toString('utf8');
          for(const needle of ['teacher','student','designer','deputy','admin','role']){
            let from=0,count=0;console.log('\n###',needle);
            while((from=code.indexOf(needle,from))>=0&&count<8){
              console.log(code.slice(Math.max(0,from-180),from+360).replace(/\n/g,' '));
              from+=needle.length;count++;
            }
          }
          NODE
