name: RAVAN profile storage diagnostic
on:
  push:
    paths:
      - '.github/workflows/profile-storage-diagnostic.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate recent profile storage
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),zlib=require('zlib');
          global.window=globalThis;
          for(const f of ['payload-1.js','payload-2a.js','payload-2b.js','payload-2c.js','payload-2d.js','payload-3.js','payload-4.js','payload-5.js','payload-6.js','payload-7.js']) vm.runInThisContext(fs.readFileSync(f,'utf8'),{filename:f});
          const html=zlib.gunzipSync(Buffer.from(global.__RAVAN_B64||'','base64')).toString('utf8');
          let from=0,hit;
          while((hit=html.indexOf('R11_RECENTS',from))>=0){
            console.log('\n=== R11_RECENTS AT',hit,'===\n');
            console.log(html.slice(Math.max(0,hit-900),Math.min(html.length,hit+1200)));
            from=hit+11;
          }
          NODE
