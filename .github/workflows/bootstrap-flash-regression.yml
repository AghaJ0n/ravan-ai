name: RAVAN bootstrap flash regression
on:
  push:
    paths:
      - 'ravan-shell-fix-v19.css'
      - '.github/workflows/bootstrap-flash-regression.yml'
permissions:
  contents: read
jobs:
  chrome-bootstrap-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q selenium
      - name: Verify legacy body is hidden until SaaS shell exists
        shell: bash
        run: |
          cat > /tmp/ravan-bootstrap-guard.html <<'HTML'
          <!doctype html>
          <html lang="fa" dir="rtl">
          <head>
            <meta charset="utf-8">
            <link rel="stylesheet" href="http://127.0.0.1:8765/ravan-shell-fix-v19.css">
          </head>
          <body><div id="legacy">legacy interface</div></body>
          </html>
          HTML
          python -m http.server 8765 >/tmp/ravan-bootstrap-http.log 2>&1 &
          sleep 2
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          import json,sys,time

          o=Options();o.add_argument('--headless=new');o.add_argument('--no-sandbox');o.add_argument('--disable-dev-shm-usage');o.add_argument('--window-size=1440,900')
          d=webdriver.Chrome(options=o)
          try:
            d.get('file:///tmp/ravan-bootstrap-guard.html')
            time.sleep(.25)
            before=d.execute_script("return {supported:CSS.supports('selector(body:has(.r19-app))'),visibility:getComputedStyle(document.body).visibility,hasApp:!!document.querySelector('.r19-app')}")
            print('BOOT_GUARD_BEFORE',json.dumps(before))
            if not before['supported']:
              print('ASSERT_FAIL :has() selector is not supported by test Chrome');sys.exit(1)
            if before['visibility']!='hidden' or before['hasApp']:
              print('ASSERT_FAIL legacy UI can paint before .r19-app exists');sys.exit(1)

            d.execute_script("const app=document.createElement('div');app.className='r19-app';document.body.appendChild(app)")
            time.sleep(.05)
            after=d.execute_script("return {visibility:getComputedStyle(document.body).visibility,hasApp:!!document.querySelector('.r19-app')}")
            print('BOOT_GUARD_AFTER',json.dumps(after))
            if after['visibility']!='visible' or not after['hasApp']:
              print('ASSERT_FAIL final SaaS UI did not become visible');sys.exit(1)
            print('ASSERT_PASS legacy bootstrap flash is guarded')
          finally:
            d.quit()
          PY
