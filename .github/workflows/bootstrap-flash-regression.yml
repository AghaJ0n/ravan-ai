name: RAVAN bootstrap flash regression
on:
  push:
    paths:
      - 'index.html'
      - 'ravan-shell-fix-v19.css'
      - '.github/workflows/bootstrap-flash-regression.yml'
permissions:
  contents: read
jobs:
  chrome-bootstrap-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q selenium
      - name: Verify no legacy frame is ever paintable during real bootstrap
        shell: bash
        run: |
          python -m http.server 8765 >/tmp/ravan-bootstrap-http.log 2>&1 &
          sleep 2
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          import json,sys,time

          o=Options()
          o.add_argument('--headless=new')
          o.add_argument('--no-sandbox')
          o.add_argument('--disable-dev-shm-usage')
          o.add_argument('--window-size=1440,900')
          o.set_capability('pageLoadStrategy','none')
          o.set_capability('goog:loggingPrefs',{'browser':'ALL'})
          d=webdriver.Chrome(options=o)
          states=[]; exposed=[]
          try:
            started=time.time()
            d.get('http://127.0.0.1:8765/?flash-regression=19.35')
            deadline=started+8.0
            while time.time()<deadline:
              try:
                s=d.execute_script("""
                  const b=document.body, app=document.querySelector('.r19-app'), boot=document.getElementById('boot');
                  const cs=b?getComputedStyle(b):null;
                  const bootVisible=!!boot && getComputedStyle(boot).visibility!=='hidden' && getComputedStyle(boot).opacity!=='0';
                  return {t:performance.now(), ready:document.readyState, hasBody:!!b, hasApp:!!app,
                    nav:document.querySelectorAll('.r19-navitem').length,
                    boot:bootVisible,
                    visibility:cs?cs.visibility:'none', opacity:cs?cs.opacity:'none'};
                """)
                states.append(s)
                # The only legal paint states are: the intentional logo splash,
                # a hidden rewritten body, or the final consolidated app.
                if s['hasBody'] and not s['boot'] and not s['hasApp'] and s['visibility']!='hidden' and s['opacity']!='0':
                  exposed.append(s)
                if s['hasApp'] and s['nav']>=6 and s['visibility']=='visible':
                  break
              except Exception:
                pass
              time.sleep(.02)

            final=d.execute_script("return {hasApp:!!document.querySelector('.r19-app'),nav:document.querySelectorAll('.r19-navitem').length,visibility:getComputedStyle(document.body).visibility,opacity:getComputedStyle(document.body).opacity}")
            print('SAMPLE_COUNT',len(states))
            print('EXPOSED_STATES',json.dumps(exposed[:10]))
            print('FINAL',json.dumps(final))
            if exposed:
              print('ASSERT_FAIL legacy body became paintable before .r19-app existed');sys.exit(1)
            if not final['hasApp'] or final['nav']<6 or final['visibility']!='visible':
              print('ASSERT_FAIL consolidated shell did not become visible');sys.exit(1)
            bad=[x for x in d.get_log('browser') if x.get('level')=='SEVERE' and 'favicon.ico' not in x.get('message','')]
            if bad:
              print('ASSERT_FAIL severe browser errors',json.dumps(bad[:5]));sys.exit(1)
            print('ASSERT_PASS zero legacy paint frames during real bootstrap')
          finally:
            d.quit()
          PY
