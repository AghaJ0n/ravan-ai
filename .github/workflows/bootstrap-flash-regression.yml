name: RAVAN bootstrap flash regression
on:
  push:
    paths:
      - 'index.html'
      - 'ravan-shell-fix-v19.css'
      - '.github/workflows/bootstrap-flash-regression.yml'
permissions:
  contents: read
jobs:
  chrome-bootstrap-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -q selenium
      - name: Verify branded cover hides every legacy frame during real bootstrap
        shell: bash
        run: |
          python -m http.server 8765 >/tmp/ravan-bootstrap-http.log 2>&1 &
          sleep 2
          python - <<'PY'
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          import json,sys,time

          o=Options()
          o.add_argument('--headless=new')
          o.add_argument('--no-sandbox')
          o.add_argument('--disable-dev-shm-usage')
          o.add_argument('--window-size=1440,900')
          o.set_capability('pageLoadStrategy','none')
          o.set_capability('goog:loggingPrefs',{'browser':'ALL'})
          d=webdriver.Chrome(options=o)
          states=[]; exposed=[]; handoff_samples=[]
          try:
            started=time.time()
            d.get('http://127.0.0.1:8765/?flash-regression=19.36')
            deadline=started+9.0
            while time.time()<deadline:
              try:
                s=d.execute_script("""
                  const b=document.body, app=document.querySelector('.r19-app'), boot=document.getElementById('boot'), handoff=document.getElementById('ravanBootHandoff');
                  const cs=b?getComputedStyle(b):null;
                  const visible=el=>!!el && getComputedStyle(el).display!=='none' && getComputedStyle(el).visibility!=='hidden' && getComputedStyle(el).opacity!=='0';
                  const bootVisible=visible(boot), handoffVisible=visible(handoff);
                  const center=document.elementFromPoint(Math.floor(innerWidth/2),Math.floor(innerHeight/2));
                  const handoffOnTop=!!(handoffVisible && center && (center===handoff || center.closest?.('#ravanBootHandoff')));
                  return {t:performance.now(), ready:document.readyState, hasBody:!!b, hasApp:!!app,
                    nav:document.querySelectorAll('.r19-navitem').length,
                    boot:bootVisible,handoff:handoffVisible,handoffOnTop,
                    visibility:cs?cs.visibility:'none', opacity:cs?cs.opacity:'none'};
                """)
                states.append(s)
                if s['handoff']:
                  handoff_samples.append(s)
                # Before the final shell exists, the user must see either the
                # original splash or the rewritten branded handoff cover.
                if s['hasBody'] and not s['hasApp'] and not s['boot']:
                  if not s['handoff'] or not s['handoffOnTop']:
                    exposed.append(s)
                if s['hasApp'] and s['nav']>=6:
                  break
              except Exception:
                pass
              time.sleep(.02)

            final=d.execute_script("return {hasApp:!!document.querySelector('.r19-app'),nav:document.querySelectorAll('.r19-navitem').length,handoff:!!document.getElementById('ravanBootHandoff')}")
            print('SAMPLE_COUNT',len(states))
            print('HANDOFF_SAMPLES',len(handoff_samples))
            print('EXPOSED_STATES',json.dumps(exposed[:10]))
            print('FINAL',json.dumps(final))
            if exposed:
              print('ASSERT_FAIL a legacy frame was not covered before .r19-app existed');sys.exit(1)
            if not handoff_samples:
              print('ASSERT_FAIL rewritten branded handoff cover was never observed');sys.exit(1)
            if not final['hasApp'] or final['nav']<6:
              print('ASSERT_FAIL consolidated shell did not become ready');sys.exit(1)
            bad=[x for x in d.get_log('browser') if x.get('level')=='SEVERE' and 'favicon.ico' not in x.get('message','')]
            if bad:
              print('ASSERT_FAIL severe browser errors',json.dumps(bad[:5]));sys.exit(1)
            print('ASSERT_PASS splash/handoff continuously covers legacy bootstrap')
          finally:
            d.quit()
          PY