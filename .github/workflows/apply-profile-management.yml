name: Apply RAVAN recent profile management
on:
  push:
    paths:
      - '.github/workflows/apply-profile-management.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add delete and clear actions for recent profiles
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('ravan-sections-v19.js')
          s=p.read_text()

          old="const PREF_KEY='ravan_shell_prefs_v19';"
          new="const PREF_KEY='ravan_shell_prefs_v19';\nconst RECENT_KEY='RAVAN_AI_RecentProfiles_v11';"
          assert old in s, 'PREF key anchor missing'
          s=s.replace(old,new,1)

          old="function recentProfiles(){return qa('.r11-pill').map((b,i)=>({index:i,title:(b.textContent||'').trim()})).filter(x=>x.title)}"
          new="""function recentProfiles(){return readJSON(RECENT_KEY,[]).map((p,index)=>({index,title:[p.roleLabel||p.role||'پروفایل',p.taskLabel||p.task||'کار'].join(' — '),data:p})).filter(x=>x.title)}
function recentProfileTitle(p){return [p?.roleLabel||p?.role||'پروفایل',p?.taskLabel||p?.task||'کار'].join(' — ')}
function syncRecentProfilesUi(){
 try{if(typeof window.renderRecent==='function'){window.renderRecent();return}}catch(e){}
 const a=readJSON(RECENT_KEY,[]),wrap=q('#r11SavedWrap'),box=q('#r11SavedProfiles');
 if(wrap)wrap.style.display=a.length?'block':'none';
 if(box)box.innerHTML=a.map((p,i)=>`<button class=\"r11-pill\" onclick=\"loadRecent(${i})\">${esc(recentProfileTitle(p))}</button>`).join('');
}
function deleteRecentProfile(index){
 const a=readJSON(RECENT_KEY,[]),p=a[index];if(!p)return false;
 const title=recentProfileTitle(p);
 if(prefs().confirmDelete!==false&&!confirm(`پروفایل «${title}» حذف شود؟`))return false;
 a.splice(index,1);writeJSON(RECENT_KEY,a);syncRecentProfilesUi();logActivity('profile','حذف پروفایل اخیر',title);toast('پروفایل حذف شد');return true;
}
function clearRecentProfiles(){
 const a=readJSON(RECENT_KEY,[]);if(!a.length)return false;
 if(!confirm(`همه ${a.length} پروفایل اخیر حذف شوند؟ این کار قابل بازگشت نیست.`))return false;
 localStorage.removeItem(RECENT_KEY);syncRecentProfilesUi();logActivity('profile','حذف همه پروفایل‌های اخیر',`${a.length} پروفایل حذف شد`);toast('همه پروفایل‌های اخیر حذف شدند');return true;
}"""
          assert old in s, 'recentProfiles anchor missing'
          s=s.replace(old,new,1)

          old='<div class="r19-subsection-head"><h3>پروفایل‌های اخیر RAVAN</h3><span>ترکیب‌های نقش، کار و AI که اخیراً ذخیره کرده‌اید</span></div>'
          new='<div class="r19-subsection-head"><div><h3>پروفایل‌های اخیر RAVAN</h3><span>ترکیب‌های نقش، کار و AI که اخیراً ذخیره کرده‌اید</span></div>${profiles.length?`<button type="button" class="r19-section-btn danger small" data-profile-clear aria-label="حذف همه پروفایل‌های اخیر">حذف همه</button>`:\'\'}</div>'
          assert old in s, 'recent profile header anchor missing'
          s=s.replace(old,new,1)

          old='<div class="r19-card-actions"><button class="r19-section-btn primary small" data-profile-open="${p.index}">ادامه این پروفایل</button></div>'
          new='<div class="r19-card-actions"><button class="r19-section-btn primary small" data-profile-open="${p.index}">ادامه این پروفایل</button><button type="button" class="r19-section-btn danger small" data-profile-delete="${p.index}" aria-label="حذف پروفایل ${esc(p.title)}">حذف</button></div>'
          assert old in s, 'profile card actions anchor missing'
          s=s.replace(old,new,1)

          old="""   const b=e.target.closest('button');if(!b)return;const id=b.dataset.projectOpen||b.dataset.projectDuplicate||b.dataset.projectRename||b.dataset.projectDelete;
   if(b.dataset.profileOpen!==undefined){const i=Number(b.dataset.profileOpen);window.RAVAN_UI?.showBuilder?.();try{window.loadRecent?.(i);logActivity('profile','باز کردن پروفایل اخیر',profiles.find(x=>x.index===i)?.title||'')}catch(err){toast('پروفایل قابل بازیابی نبود','error')}return}
   if(!id)return;"""
          new="""   const b=e.target.closest('button');if(!b)return;const id=b.dataset.projectOpen||b.dataset.projectDuplicate||b.dataset.projectRename||b.dataset.projectDelete;
   if(b.dataset.profileClear!==undefined){if(clearRecentProfiles())renderProjects();return}
   if(b.dataset.profileDelete!==undefined){if(deleteRecentProfile(Number(b.dataset.profileDelete)))renderProjects();return}
   if(b.dataset.profileOpen!==undefined){const i=Number(b.dataset.profileOpen);window.RAVAN_UI?.showBuilder?.();try{window.loadRecent?.(i);logActivity('profile','باز کردن پروفایل اخیر',profiles.find(x=>x.index===i)?.title||'')}catch(err){toast('پروفایل قابل بازیابی نبود','error')}return}
   if(!id)return;"""
          assert old in s, 'profile click handler anchor missing'
          s=s.replace(old,new,1)
          p.write_text(s)

          idx=Path('index.html')
          x=idx.read_text()
          old='ravan-sections-v19.js?v=19.17'
          assert old in x, 'index sections version anchor missing'
          x=x.replace(old,'ravan-sections-v19.js?v=19.22',1)
          idx.write_text(x)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ravan-sections-v19.js index.html
          git commit -m 'Add recent profile delete and clear actions'
          git push
